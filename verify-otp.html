<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelGrid | Verify OTP</title>

</head>

<body>

    <div class="container">

        <h2>Verify OTP</h2>

        <p>Enter the OTP sent to your email</p>

        <form id="otpForm">

            <input type="text" id="otp" placeholder="Enter 6 digit OTP" maxlength="6" required>

            <button type="submit">
                Verify OTP
            </button>

        </form>

    </div>

    <script src="js/verify-otp.js"></script>

</body>

</html>
