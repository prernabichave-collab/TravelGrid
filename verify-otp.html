<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TravelGrid - Verify OTP</title>

    <link rel="stylesheet" href="/css/verify-otp.css">
</head>

<body>

    <div class="otp-container">

        <div class="otp-card">

            <div class="icon">🔐</div>

            <h1>Verify OTP</h1>

            <p class="subtitle">
                Enter the 6-digit OTP sent to your registered email.
            </p>

            <form id="otpForm">

                <label for="otp">Enter OTP</label>

                <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" inputmode="numeric"
                    autocomplete="one-time-code" required>

                <button type="submit">
                    Verify OTP
                </button>

            </form>

            <p id="message"></p>

            <a href="/forgot-password.html" class="back-link">
                ← Back to Forgot Password
            </a>

        </div>

    </div>


    <script>

        document.getElementById("otpForm").addEventListener("submit", async function (e) {

            e.preventDefault();

            const otp = document.getElementById("otp").value.trim();
            const email = localStorage.getItem("resetEmail");

            const message = document.getElementById("message");

            if (!email) {
                message.innerText = "Email not found. Please try again.";
                message.className = "error";
                return;
            }

            if (otp.length !== 6) {
                message.innerText = "Please enter a valid 6-digit OTP.";
                message.className = "error";
                return;
            }

            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/verify-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            otp: otp
                        })
                    }
                );

                const data = await response.json();

                message.innerText = data.message;

                if (response.ok) {

                    message.className = "success";

                    localStorage.setItem("verifiedOTP", otp);

                    setTimeout(function () {
                        window.location.href = "/reset-password.html";
                    }, 1000);

                } else {

                    message.className = "error";

                }

            } catch (error) {

                console.log("OTP Error:", error);

                message.innerText = "Server connection failed.";
                message.className = "error";

            }

        });

    </script>

</body>

</html>
